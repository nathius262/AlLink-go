<!-- ==========================================
    CREATE CONTACT
=========================================== -->

<div class="admin-content">

  <!-- PAGE HEADER -->

  <div class="admin-page-header">

    <div>

      <span class="admin-page-label">
        CONTACT MANAGEMENT
      </span>

      <h1>
        Create Contact
      </h1>

      <p>
        Add a new contact record to your contact directory.
      </p>

    </div>


    <a href="/admin/contact" class="admin-secondary-btn">

      <i class="bi bi-arrow-left"></i>

      Back to Contacts

    </a>

  </div>


  <!-- ==========================================
        CONTACT FORM
    =========================================== -->

  <div class="admin-form-card">

    <form action="/admin/contact/create" method="POST" id="create-form" class="needs-validation contact-form" novalidate>


      <!-- ==========================================
                CONTACT INFORMATION
            =========================================== -->

      <div class="admin-form-section">

        <div class="admin-form-section-header">

          <div class="admin-form-section-icon">

            <i class="bi bi-person"></i>

          </div>


          <div>

            <h2>
              Contact Information
            </h2>

            <p>
              Provide the contact's basic contact information.
            </p>

          </div>

        </div>


        <div class="row g-4">

          <div class="col-md-6">

            <label for="fullName">
              Full Name
            </label>

            <input type="text" id="fullName" name="name" placeholder="Your full name" required>

          </div>


          <!-- Email -->

          <div class="col-md-6">

            <label for="email">
              Email Address
            </label>

            <input type="email" id="email" name="email" placeholder="you@example.com" required>

          </div>


          <!-- Phone -->

          <div class="col-md-6">

            <label for="phone">
              Phone / WhatsApp
            </label>

            <input type="tel" id="phone" name="phone" placeholder="0707 235 5286" required>

          </div>


          <!-- Service -->

          <div class="col-md-6">

            <label for="service">
              What Do You Need?
            </label>

            <select id="service" name="service" required>

              <option value="" selected disabled>
                Select a service
              </option>

              <option value="digital-product">
                Digital Product Creation
              </option>

              <option value="packaging">
                Product Design & Packaging
              </option>

              <option value="branding">
                Branding & Brand Identity
              </option>

              <option value="printing">
                Offset & Digital Printing
              </option>

              <option value="ready-packaging">
                Ready-Made Packaging
              </option>

              <option value="other">
                Something Else
              </option>

            </select>

          </div>


          <!-- Project Budget -->

          <div class="col-md-6">

            <label for="budget">
              Estimated Budget
            </label>

            <select id="budget" name="budget">

              <option value="" selected>
                Select budget range
              </option>

              <option value="under-50k">
                Under ₦50,000
              </option>

              <option value="50k-150k">
                ₦50,000 — ₦150,000
              </option>

              <option value="150k-300k">
                ₦150,000 — ₦300,000
              </option>

              <option value="300k-plus">
                ₦300,000+
              </option>

              <option value="not-sure">
                Not Sure Yet
              </option>

            </select>

          </div>


          <!-- Deadline -->

          <div class="col-md-6">

            <label for="deadline">
              Project Timeline
            </label>

            <select id="deadline" name="project_timeline">

              <option value="" selected>
                When do you need it?
              </option>

              <option value="urgent">
                As Soon As Possible
              </option>

              <option value="1-2-weeks">
                1 — 2 Weeks
              </option>

              <option value="2-4-weeks">
                2 — 4 Weeks
              </option>

              <option value="month-plus">
                1 Month+
              </option>

              <option value="flexible">
                I'm Flexible
              </option>

            </select>

          </div>


          <!-- Message -->

          <div class="col-12">

            <label for="message">
              Tell Us About Your Project
            </label>

            <textarea id="message" name="content" rows="6"
              placeholder="Tell us what you're looking to create, the quantity, specifications, references or anything else we should know..."
              required></textarea>

          </div>

        </div>

      </div>
      <!-- ==========================================
                FORM ACTIONS
            =========================================== -->

      <div class="admin-form-footer">

        <a href="/admin/contact" class="admin-secondary-btn">

          <i class="bi bi-x-lg"></i>

          Cancel

        </a>


        <button type="submit" class="admin-primary-btn">

          <i class="bi bi-person-plus"></i>

          Create Contact

        </button>

      </div>

    </form>

  </div>

</div>


<script type="module" src="/assets/js/form-handler.js">
</script>
